[project]
name = "p1"
version = "0.1.0"
description = "EPFL ML Project 1: heart-disease (MICHD) prediction"
readme = "README.md"
requires-python = ">=3.11"  # tomllib
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
]

[project.scripts]
p1 = "p1.cli:main"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "gitpython>=3.2.1",
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""  # flat layout: p1/ at the repo root
